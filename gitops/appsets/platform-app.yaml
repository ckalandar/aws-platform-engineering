apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: platform-app
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/ckalandar/aws-platform-engineering.git
    targetRevision: main
    path: gitops/applications/platform

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true