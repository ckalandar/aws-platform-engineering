apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: springboot
  annotations:
    external-dns.alpha.kubernetes.io/hostname: springboot.floci.bright.zorbos.com
spec:
  ingressClassName: alb
  rules:
    - host: springboot.floci.bright.zorbos.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: springboot-canary
                port:
                  number: 80
