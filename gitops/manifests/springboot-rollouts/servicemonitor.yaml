apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: springboot
  namespace: springboot

  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - springboot

  selector:
    matchLabels:
      app: springboot

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
