apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: springboot
  namespace: springboot

spec:

  replicas: 2

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: springboot

  template:

    metadata:
      labels:
        app: springboot

    spec:

      serviceAccountName: default

      containers:

        - name: springboot

          image: 136863648867.dkr.ecr.us-east-1.amazonaws.com/platform-demo:b67b86c333347d00e7828fe334e5eaa651608343

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:

            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:

            httpGet:
              path: /actuator/health
              port: 8080

            initialDelaySeconds: 10

          livenessProbe:

            httpGet:
              path: /actuator/health
              port: 8080

            initialDelaySeconds: 30

  strategy:

    canary:

      canaryService: springboot-canary

      stableService: springboot

      steps:

        - setWeight: 10

        - pause:
            duration: 60s

        - setWeight: 50

        - pause:
            duration: 60s

        - setWeight: 100
