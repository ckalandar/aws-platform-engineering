apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: namespace-admin
  namespace: springboot

rules:

- apiGroups: [""]

  resources:
    - pods
    - services
    - configmaps
    - secrets

  verbs:
    - "*"

- apiGroups: ["apps"]

  resources:
    - deployments
    - replicasets

  verbs:
    - "*"

- apiGroups: ["autoscaling"]

  resources:
    - horizontalpodautoscalers

  verbs:
    - "*"
