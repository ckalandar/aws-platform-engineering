apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: springboot
  namespace: springboot

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: springboot

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70
