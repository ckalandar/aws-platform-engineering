apiVersion: apps/v1
kind: Deployment

metadata:
  name: springboot

spec:
  replicas: 2

  selector:
    matchLabels:
      app: springboot

  template:
    metadata:
      labels:
        app: springboot

    spec:
      containers:
        - name: springboot

          image: 136863648867.dkr.ecr.us-east-1.amazonaws.com/platform-demo:72d9736332da46ab55de606a15ec9c13677e958f

          ports:
            - containerPort: 8080

          env:
            - name: APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-config
                  key: username

            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-config
                  key: password

            - name: APP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-config
                  key: apiKey

            - name: OTEL_SERVICE_NAME
              value: platform-demo

            - name: OTEL_TRACES_EXPORTER
              value: otlp

            - name: OTEL_METRICS_EXPORTER
              value: none

            - name: OTEL_LOGS_EXPORTER
              value: none

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.tempo.svc.cluster.local:4318

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
