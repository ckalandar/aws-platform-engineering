apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: monitoring
spec:
  groups:
    - name: platform.rules

      rules:

        - alert: HighCPUUsage
          expr: >
            100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High CPU usage

        - alert: HighMemoryUsage
          expr: >
            ((sum(node_memory_MemTotal_bytes)-sum(node_memory_MemAvailable_bytes))
             /sum(node_memory_MemTotal_bytes))*100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High memory usage

        - alert: PodCrashLooping
          expr: >
            kube_pod_container_status_waiting_reason{
              reason="CrashLoopBackOff"
            } > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Pod CrashLoopBackOff

        - alert: SpringBoot5xx
          expr: >
            sum(
              rate(
                http_server_requests_seconds_count{
                  status=~"5.."
                }[5m]
              )
            ) > 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: SpringBoot returning 5xx
