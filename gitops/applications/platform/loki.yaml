apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: loki
  namespace: argocd

spec:
  project: default

  destination:
    namespace: loki
    server: https://kubernetes.default.svc

  sources:

    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.43.0

      helm:
        valueFiles:
          - $values/gitops/values/loki/dev.yaml

    - repoURL: https://github.com/ckalandar/aws-platform-engineering.git
      targetRevision: dev-floci
      ref: values

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
