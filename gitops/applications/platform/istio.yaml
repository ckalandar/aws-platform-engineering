apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: istio
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/ckalandar/aws-platform-engineering.git
    targetRevision: dev-floci
    path: gitops/manifests/istio

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
