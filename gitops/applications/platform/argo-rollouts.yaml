apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: argo-rollouts
  namespace: argocd

spec:

  project: default

  destination:
    namespace: argo-rollouts
    server: https://kubernetes.default.svc

  sources:
    - repoURL: oci://ghcr.io/argoproj/argo-helm/argo-rollouts
      chart: argo-rollouts
      targetRevision: 2.40.4

      helm:
        valueFiles:
          - $values/gitops/values/argo-rollouts/dev.yaml

    - repoURL: https://github.com/ckalandar/aws-platform-engineering.git
      targetRevision: dev-floci
      ref: values

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
