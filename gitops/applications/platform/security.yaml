apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: security
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/ckalandar/aws-platform-engineering.git
    targetRevision: dev-floci
    path: gitops/manifests/security

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
