server:
  port: 8080

spring:
  application:
    name: platform-demo

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

otel:
  exporter:
    otlp:
      endpoint: http://tempo.tempo.svc.cluster.local:4318

  traces:
    exporter: otlp

  metrics:
    exporter: none

  logs:
    exporter: none

  resource:
    attributes:
      service.name: platform-demo

logging:
  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss}
      [%thread]
      %-5level
      trace_id=%X{trace_id:-}
      span_id=%X{span_id:-}
      %logger{36}
      - %msg%n
