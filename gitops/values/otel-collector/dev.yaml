mode: deployment

config:

  receivers:

    otlp:
      protocols:
        grpc:
        http:

  processors:

    batch:

  exporters:

    debug:

    otlp:
      endpoint: tempo.tempo.svc.cluster.local:4317
      tls:
        insecure: true

  service:

    pipelines:

      traces:
        receivers:
          - otlp

        processors:
          - batch

        exporters:
          - debug
          - otlp
