grafana:

  adminPassword: admin123

  service:
    type: ClusterIP

  ingress:
    enabled: true

    ingressClassName: alb

    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip

    hosts:
      - grafana.dev.learnsystems.co

  sidecar:

    dashboards:
      enabled: true
      searchNamespace: ALL

    datasources:
      enabled: true

  dashboardProviders:

    dashboardproviders.yaml:

      apiVersion: 1

      providers:

        - name: default
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: false
          editable: true

          options:
            path: /var/lib/grafana/dashboards/default

  additionalDataSources:

    - name: Loki
      type: loki
      access: proxy
      url: http://loki.loki.svc.cluster.local:3100
      isDefault: false

    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.tempo.svc.cluster.local:3200

prometheus:

  prometheusSpec:

    retention: 15d

    storageSpec:

      volumeClaimTemplate:

        spec:

          accessModes:
            - ReadWriteOnce

          storageClassName: local-path

          resources:

            requests:
              storage: 20Gi

alertmanager:

  alertmanagerSpec:

    storage:

      volumeClaimTemplate:

        spec:

          accessModes:
            - ReadWriteOnce

          storageClassName: local-path

          resources:

            requests:
              storage: 5Gi
